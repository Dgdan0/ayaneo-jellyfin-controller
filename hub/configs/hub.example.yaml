# Ayaneo hub -- example configuration.
#
# Copy to %ProgramData%\AyaneoHub\hub.yaml and edit. Credentials belong in the
# environment or in a sibling hub.secrets.yaml, which is merged over this file
# and is gitignored -- so this one stays diffable and safe to share.
#
# The hub refuses to start on a misconfiguration rather than starting in a
# half-working state, and exits 78 so a service manager stops retrying. Run
# `hub --check` to validate without starting.

server:
  # Loopback. Caddy terminates TLS and reaches the hub here; binding anywhere
  # else is refused unless allow_public_bind is set AND a trusted proxy is
  # declared, because the bearer token would otherwise cross the wire in clear.
  listen: "127.0.0.1:8791"   # 8787 is Readarr's default; do not use it
  public_url: "https://myjellydan.duckdns.org"
  allow_public_bind: false
  trust_proxy_cidrs: ["127.0.0.1/32"]
  request_timeout: 20s
  shutdown_grace: 10s
  # Durable download grants and offline watch-progress receipts. Relative paths
  # live beside hub.yaml, which is ideal for the FireDaemon installation.
  offline_registry: "offline-grants.json"
  # Stable work IDs and source bindings for the reading catalog.
  reading_catalog: "reading-catalog.json"
  reading_transfers: "reading-transfers.json"

auth:
  # Generate with: hubctl token new --label pocketds
  # Only the digest is stored, so a leaked config costs nothing.
  tokens:
    - label: "pocketds"
      sha256: "PUT_THE_SHA256_FROM_HUBCTL_HERE"
      scopes: ["read", "request", "control", "play", "download", "reading"]

  # Per device, so one busy handheld cannot starve another.
  rate_limit:
    rpm: 90
    burst: 30

  # Someone presenting wrong tokens is guessing. Stop answering them.
  auth_failure_ban:
    attempts: 5
    window: 1m
    ban: 15m

services:
  jellyfin:
    enabled: true
    base_url: "http://127.0.0.1:8096"
    # Optional address opened by Manage on the handheld. Use this when base_url
    # is loopback, a Docker hostname, or otherwise visible only to the hub.
    web_url: "https://jellyfin.example.com"
    api_key: "${env:JELLYFIN_API_KEY}"
    user_id: ""          # whose views and watch state to surface
    timeout: 8s

  jellyseerr:
    enabled: true
    base_url: "http://127.0.0.1:5055"
    web_url: ""
    api_key: "${env:JELLYSEERR_API_KEY}"
    # Without this, requests are attributed to admin user 1 rather than to you.
    act_as_user_id: 1

  # Indexer manager. It is shown in Manage for health and opening its dashboard;
  # the handheld never receives this API key.
  prowlarr:
    enabled: false
    base_url: "http://127.0.0.1:9696"
    web_url: ""
    api_key: "${env:PROWLARR_API_KEY}"

  radarr:
    enabled: true
    base_url: "http://127.0.0.1:7878"
    web_url: ""
    api_key: "${env:RADARR_API_KEY}"
    jellyseerr_service_id: 0

  # Books and audiobooks. This is intentionally a Manage-only integration for
  # now; Discovery, Library and requests remain movie/TV focused.
  readarr:
    enabled: false
    base_url: "http://127.0.0.1:8787"
    web_url: ""
    api_key: "${env:READARR_API_KEY}"

  # Unified discovery for ebooks, audiobooks, comics, manga and light novels.
  # The personal key handles discovery and transfer reads. Acquisition writes
  # use a dedicated local admin service account to obtain a renewable mobile
  # bearer; its password belongs in hub.secrets.yaml or an environment variable.
  bookkeeprr:
    enabled: false
    base_url: "http://127.0.0.1:3000"
    web_url: ""
    api_key: "${env:BOOKKEEPRR_API_KEY}"
    username: "pocketds-hub"
    password: "${env:BOOKKEEPRR_PASSWORD}"

  # Read-only comic, manga and visual-book catalog. Generate a revocable auth
  # key in Kavita's user settings; the Hub sends it only as X-Api-Key.
  kavita:
    enabled: false
    base_url: "http://127.0.0.1:5000"
    web_url: ""
    api_key: "${env:KAVITA_API_KEY}"

  # Ebook, audiobook and synchronized read-along catalog. Storyteller's token
  # endpoint issues a renewable bearer token from this dedicated account.
  storyteller:
    enabled: false
    base_url: "http://127.0.0.1:8001"
    web_url: ""
    username: "pocketds"
    password: "${env:STORYTELLER_PASSWORD}"

  sonarr:
    enabled: true
    base_url: "http://127.0.0.1:8989"
    web_url: ""
    api_key: "${env:SONARR_API_KEY}"
    jellyseerr_service_id: 0

  bazarr:
    enabled: true
    base_url: "http://127.0.0.1:6767"
    web_url: ""
    api_key: "${env:BAZARR_API_KEY}"
    # "" probes for it. Set only if Bazarr is behind a subfolder, because its
    # base_url setting prefixes every route.
    api_base_path: ""

  qbittorrent:
    enabled: true
    base_url: "http://127.0.0.1:8080"
    web_url: ""
    # Newer builds accept a bearer key (Web UI settings). Older ones need the
    # login below instead -- either is accepted.
    api_key: "${env:QBIT_API_KEY}"
    username: "${env:QBIT_USER}"
    password: "${env:QBIT_PASS}"

log:
  level: info
  retain_days: 14
