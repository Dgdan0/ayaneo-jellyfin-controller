# The Apple client: one SwiftUI app for iPhone, iPad and Mac.
# Generate the Xcode project with `scripts/mac.sh project` (XcodeGen); the
# generated Hub.xcodeproj is gitignored, so this file is the project.
name: Hub
options:
  bundleIdPrefix: com.dgdan
  deploymentTarget:
    # The MacBook runs macOS 15, and iPads not yet moved to 26 should still work.
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The first TestFlight build; scripts/mac.sh testflight numbers each upload.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set when the Apple Developer Program enrolment is approved; until then
    # simulator and local Mac builds are signed to run locally.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  HubKit:
    path: HubKit
targets:
  Hub:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Hub
    dependencies:
      - package: HubKit
    # The Mac's sandbox and outgoing network. macOS only: App Store Connect
    # refuses an iOS build signed with macOS entitlements (ITMS-90046).
    entitlements:
      path: Hub/Hub.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Hub/Info.plist
      properties:
        CFBundleDisplayName: JellyHub
        # From the build settings, so scripts/mac.sh testflight can number a build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
          - Bricolage-SemiBold.ttf
          - Bricolage-Bold.ttf
          - Bricolage-ExtraBold.ttf
        ATSApplicationFontsPath: .
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Picture in picture keeps playing with the app in the background
        # (#2); without it, leaving the app ends playback (PlayerModel).
        UIBackgroundModes:
          - audio
        # The hub is HTTPS (Tailscale Serve, or the DuckDNS fallback). Local
        # networking stays open for a hub on loopback during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GCSupportsControllerUserInteraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgdan.jellyhub
        PRODUCT_NAME: JellyHub
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: ""
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  # What only a running app can show, driven in a simulator against the demo
  # hub (-demo), never the real one: `scripts/mac.sh uitest`.
  HubUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: HubUITests
    dependencies:
      - target: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgdan.jellyhub.uitests
        TEST_TARGET_NAME: Hub
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Hub:
    build:
      targets:
        Hub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HubUITests
