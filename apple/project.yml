# The Apple client: one SwiftUI app for iPhone, iPad and Mac.
# Generate the Xcode project with `scripts/mac.sh project` (XcodeGen); the
# generated Hub.xcodeproj is gitignored, so this file is the project.
name: Hub
options:
  bundleIdPrefix: com.dgdan
  deploymentTarget:
    # The MacBook runs macOS 15, and iPads not yet moved to 26 should still work.
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The first TestFlight build; scripts/mac.sh testflight numbers each upload.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set when the Apple Developer Program enrolment is approved; until then
    # simulator and local Mac builds are signed to run locally.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  HubKit:
    path: HubKit
  # The ebook reader (#25, phase 4): Readium's Swift toolkit, pinned to one
  # release. Its navigator is UIKit, so the app takes it on iOS only.
  # Licences: THIRD_PARTY_SOFTWARE.md and Hub/Resources/Licenses.
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  # Google Cast to the TV (#44): Google's own Swift package, the dynamic
  # framework (it carries the Cast button's pictures). iOS only: the Mac has
  # no Cast SDK and keeps AirPlay.
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
targets:
  Hub:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Hub
    dependencies:
      - package: HubKit
      - package: Readium
        product: ReadiumShared
        destinationFilters: [iOS]
      - package: Readium
        product: ReadiumStreamer
        destinationFilters: [iOS]
      - package: Readium
        product: ReadiumNavigator
        destinationFilters: [iOS]
      - package: GoogleCast
        product: GoogleCastDynamic
        destinationFilters: [iOS]
    # The Mac's sandbox and outgoing network. macOS only: App Store Connect
    # refuses an iOS build signed with macOS entitlements (ITMS-90046).
    entitlements:
      path: Hub/Hub.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Hub/Info.plist
      properties:
        CFBundleDisplayName: JellyHub
        # From the build settings, so scripts/mac.sh testflight can number a build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
          - Bricolage-SemiBold.ttf
          - Bricolage-Bold.ttf
          - Bricolage-ExtraBold.ttf
          # The ebook reader's own faces (#47): Literata is its default, and Readium
          # is given these files by name (`BookNavigator`).
          - Literata.ttf
          - Literata-Italic.ttf
          - AtkinsonHyperlegibleNext.ttf
        ATSApplicationFontsPath: .
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Picture in picture keeps playing with the app in the background
        # (#2); without it, leaving the app ends playback (PlayerModel).
        UIBackgroundModes:
          - audio
        # The hub is HTTPS (Tailscale Serve, or the DuckDNS fallback). Local
        # networking stays open for a hub on loopback during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GCSupportsControllerUserInteraction: true
        # Google Cast finds TVs on the home network (#44): Google's Default
        # Media Receiver, CC1AD845, and any Cast device.
        NSLocalNetworkUsageDescription: JellyHub looks for Chromecasts and Google TVs on your network so a video can play on the TV.
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgdan.jellyhub
        PRODUCT_NAME: JellyHub
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: ""
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      configs:
        Debug:
          # The Mac's Debug build has an id of its own: the TestFlight copy in
          # /Applications owns com.dgdan.jellyhub's container, which macOS
          # keeps from every other app, an SSH session included (mac-shot).
          PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]: com.dgdan.jellyhub.debug
  # What only a running app can show, driven in a simulator against the demo
  # hub (-demo), never the real one: `scripts/mac.sh uitest`.
  HubUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: HubUITests
    dependencies:
      - target: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgdan.jellyhub.uitests
        TEST_TARGET_NAME: Hub
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Hub:
    build:
      targets:
        Hub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HubUITests
