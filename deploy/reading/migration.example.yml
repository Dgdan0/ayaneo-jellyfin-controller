schema_version: 1

# Copy this file to migration.local.yml. The local file is ignored because it
# records host filesystem paths. Every source is scanned read-only.
sources:
  - id: komga-comics
    kind: comic
    root: D:\Media\Comics
  - id: komga-manga
    kind: manga
    root: D:\Media\Manga
  - id: existing-books
    kind: book
    root: D:\Media\Books
  - id: existing-audiobooks
    kind: audiobook
    root: D:\Media\Audiobooks

# These are proposed destinations. The dry-run command does not create, copy,
# move, rename, or delete anything below them.
destinations:
  book: D:\Media\Reading\Books
  audiobook: D:\Media\Reading\Audiobooks
  comic: D:\Media\Reading\Comics
  manga: D:\Media\Reading\Manga

# Komga progress is scoped to the authenticated account. Add one entry per
# account whose progress and read lists must be retained. A revocable API key is
# preferred. Generate it in Komga Account Settings and put it only in the named
# environment variable; the key never appears in this file or the report.
komga_exports:
  - id: primary
    base_url: http://127.0.0.1:25600/komga
    api_key_env: POCKETDS_KOMGA_PRIMARY_API_KEY

# Basic authentication remains available when an account cannot use an API
# key. Use username_env and password_env together instead of api_key_env.
